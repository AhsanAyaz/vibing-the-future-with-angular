# Workflow for deploying slides and Angular app to GitHub Pages
name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Build slides
      - name: Install slides dependencies
        run: npm ci

      - name: Build slides
        run: npm run build

      # Build Angular app
      - name: Install Angular app dependencies
        run: cd angular-webllm-app && npm ci

      - name: Build Angular app
        run: cd angular-webllm-app && npm run build -- --base-href /vibing-the-future-with-angular/app/

      # Prepare deployment directory with both slides and app
      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp -r dist/vibing-the-future-with-angular/* deploy/
          mkdir -p deploy/app
          cp -r angular-webllm-app/dist/angular-webllm-app/browser/* deploy/app/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload combined deployment folder
          path: './deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
